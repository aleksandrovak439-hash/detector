<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Детектор Лжи — видеопробы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.25s, color 0.2s, border-color 0.2s;
        }

        /* светлая тема */
        :root, body.light {
            --bg-body: #f8fafc;
            --bg-header: #ffffff;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.05);
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --chip-bg: #f1f5f9;
            --modal-bg: rgba(0,0,0,0.5);
        }

        /* тёмная тема */
        body.dark {
            --bg-body: #0a0c10;
            --bg-header: #11151c;
            --card-bg: #161c27;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-light: #2d3a4e;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.5);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.6);
            --accent: #60a5fa;
            --accent-hover: #93c5fd;
            --chip-bg: #1e2a3a;
            --modal-bg: rgba(0,0,0,0.7);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
        }

        .header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-light);
            padding: 1.25rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: var(--shadow-sm);
        }
        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
        }
        .title-section h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .title-section p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }
        .theme-toggle {
            background-color: var(--chip-bg);
            border: 1px solid var(--border-light);
            border-radius: 60px;
            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
        }
        .theme-toggle:hover {
            background-color: var(--accent);
            color: white;
        }
        .main-content {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* плашка утверждённые (пустая) */
        .approved-section {
            background-color: var(--card-bg);
            border-radius: 1.5rem;
            border: 1px solid var(--border-light);
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);
        }
        .approved-section h2 {
            font-size: 1.4rem;
            margin-bottom: 0.75rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .approved-empty {
            color: var(--text-muted);
            font-style: italic;
            padding: 0.5rem 0;
        }

        /* сетка серий */
        .series-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.8rem;
        }
        .series-card {
            background: var(--card-bg);
            border-radius: 1.5rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .card-header {
            padding: 1rem 1.5rem 0.5rem;
            border-bottom: 1px solid var(--border-light);
        }
        .series-number {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .badge-count {
            font-size: 0.75rem;
            background: var(--chip-bg);
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
        }
        .characters-list {
            padding: 1rem 1.5rem 1.5rem;
        }
        .character-items {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            list-style: none;
        }
        .character-item {
            background: var(--chip-bg);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .character-item:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(1.02);
        }
        .character-item .has-probes {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            margin-left: 0.2rem;
            flex-shrink: 0;
        }
        .character-item .probe-count {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-left: 0.2rem;
        }
        .empty-message {
            color: var(--text-muted);
            padding: 0.5rem;
            text-align: center;
            background: var(--chip-bg);
            border-radius: 1rem;
        }

        /* модальное окно со списком проб */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-bg);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal.active {
            display: flex;
        }
        .modal-container {
            background: var(--card-bg);
            border-radius: 2rem;
            max-width: 700px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.5rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
        }
        .modal-close:hover {
            color: var(--accent);
        }
        .modal-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            color: var(--accent);
        }

        /* карточка пробы — оптимизирована для мобильных */
        .probe-card {
            background: var(--chip-bg);
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            flex-wrap: nowrap;
        }
        .probe-photo {
            flex-shrink: 0;
        }
        .probe-photo img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--accent);
            transition: 0.1s;
        }
        .probe-photo img:hover {
            transform: scale(1.02);
        }
        .probe-info {
            flex: 1;
            min-width: 0;
        }
        .probe-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.2rem;
            word-break: break-word;
        }
        .probe-details {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 0.4rem;
        }
        .probe-details span {
            display: inline-block;
            margin-right: 0.5rem;
        }
        .probe-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
        }
        .watch-video-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.1s;
            display: inline-block;
        }
        .watch-video-btn:hover {
            background: var(--accent-hover);
        }

        /* модалка для увеличения фото */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
            z-index: 1300;
            cursor: pointer;
        }
        .image-modal.active {
            display: flex;
        }
        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 1rem;
            box-shadow: 0 0 30px black;
        }
        .close-image {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 10;
        }

        /* видео-модалка */
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            align-items: center;
            justify-content: center;
            z-index: 1200;
        }
        .video-modal.active {
            display: flex;
        }
        .video-container {
            position: relative;
            width: 90%;
            max-width: 1000px;
            background: black;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 25px 40px rgba(0,0,0,0.5);
        }
        .video-responsive {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
        }
        .video-responsive iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .video-close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            color: white;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: 0.2s;
            z-index: 20;
            font-family: inherit;
        }
        .video-close-btn:hover {
            background: var(--accent);
            transform: scale(1.02);
        }

        .footer {
            text-align: center;
            padding: 2rem;
            margin-top: 2rem;
            border-top: 1px solid var(--border-light);
            color: var(--text-muted);
        }

        /* ========== АДАПТИВНОСТЬ ДЛЯ МОБИЛЬНЫХ ========== */
        @media (max-width: 640px) {
            .modal-title {
                font-size: 1.3rem;
            }
            .series-grid {
                gap: 1rem;
            }
            .probe-card {
                flex-wrap: nowrap;
                gap: 0.8rem;
                padding: 0.8rem;
            }
            .probe-photo img {
                width: 70px;
                height: 70px;
            }
            .probe-name {
                font-size: 1rem;
            }
            .probe-details {
                font-size: 0.75rem;
            }
            .probe-desc {
                font-size: 0.7rem;
            }
            .watch-video-btn {
                font-size: 0.75rem;
                padding: 0.3rem 0.8rem;
                margin-top: 0.2rem;
            }
            .video-close-btn {
                top: 8px;
                right: 8px;
                font-size: 0.8rem;
                padding: 0.3rem 0.7rem;
            }
            .close-image {
                top: 15px;
                right: 20px;
                font-size: 1.6rem;
            }
        }
        @media (max-width: 480px) {
            .probe-card {
                gap: 0.6rem;
                padding: 0.6rem;
            }
            .probe-photo img {
                width: 60px;
                height: 60px;
            }
            .character-item .probe-count {
                font-size: 0.6rem;
            }
        }
    </style>
</head>

                        videoUrl: `<iframe src="https://vkvideo.ru/video_ext.php?oid=-221927186&id=456239175&hash=82cb32e311a48439&hd=3" width="1280" height="720" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; screen-wake-lock;" frameborder="0" allowfullscreen></iframe>`,
                        details: "возраст не указан"
                    }
                ]
            },
            "соседка Шаталовых": {
                probes: [
                    {
                        name: "Ольга Костырко",
                        photo: "photos/Костырко.jpg",
                        videoUrl: `<iframe src="https://vkvideo.ru/video_ext.php?oid=-221927186&id=456239176&hash=9691f25323c7614b&hd=3" width="1280" height="720" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; screen-wake-lock;" frameborder="0" allowfullscreen></iframe>`,
                        details: "164 см • 46 размер • 39 нога"
                    },
                    {
                        name: "Орлова Людмила",
                        photo: "photos/Орлова.jpg",
                        videoUrl: `<iframe src="https://vkvideo.ru/video_ext.php?oid=-221927186&id=456239177&hash=d70a0fd5fe8b645a&hd=3" width="1280" height="720" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; screen-wake-lock;" frameborder="0" allowfullscreen></iframe>`,
                        details: "47 лет • 164 см • 44 размер • 37 нога"
                    },
                    {
                        name: "Еременко Татьяна",
                        photo: "photos/Еременко.jpg",
                        videoUrl: `<iframe src="https://vkvideo.ru/video_ext.php?oid=-221927186&id=456239178&hash=10d4eddf17cb4190&hd=3" width="1280" height="720" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; screen-wake-lock;" frameborder="0" allowfullscreen></iframe>`,
                        details: "177 см • 42-44 размер"
                    }
                ]
            }
        };

        // ======================= ДАННЫЕ СЕРИЙ (1–16) =======================
        const SERIES_DATA = [
            { number: 1, characters: ["Рожнова","Рожнов","Девочка","Изюмов","Кира","Консьержка","Кинолог","Жительница дома","Дворник - азиат"] },
            { number: 2, characters: ["соседка Дроздова"] },
            { number: 3, characters: ["Николай Корнилов","Хостес","Охранник ресторана","Массажистка","Мужик в трусах","Мать Стаса","Стас","Официантка","Плисов","Елена","Кладовщик"] },
            { number: 4, characters: ["Котов","Сержант","Старший Сержант","Секретарша","Директор Школы","Охранник Стройки","Бармен","соседка Шаталовых"] },
            { number: 5, characters: [] },
            { number: 6, characters: ["Андрей", "ВРАЧ"] },
            { number: 7, characters: [] },
            { number: 8, characters: [] },
            { number: 9, characters: ["Плешаков","Менеджер","Дворник - азиат","Стулов","Консьержка","Женщина","Бабуля","Горохов","Курьер (каскадер)","Муж Петровой"] },
            { number: 10, characters: ["Дежурный"] },
            { number: 11, characters: [] },
            { number: 12, characters: ["Рожкова","Сосед","Журналистка","Оператор","Оксана","Владелец Тира","Прохожий"] },
            { number: 13, characters: [] },
            { number: 14, characters: [] },
            { number: 15, characters: [] },
            { number: 16, characters: [] }
        ];

        // ======================= ФУНКЦИИ =======================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function renderSeries() {
            const container = document.getElementById('seriesContainer');
            let html = `<div class="series-grid">`;
            for (const series of SERIES_DATA) {
                const chars = series.characters;
                html += `
                    <div class="series-card">
                        <div class="card-header">
                            <div class="series-number">
                                🎞️ Серия ${series.number}
                                <span class="badge-count">${chars.length} перс.</span>
                            </div>
                        </div>
                        <div class="characters-list">
                            <div class="character-items">
                `;
                if (chars.length === 0) {
                    html += `<div class="empty-message">✨ Персонажи скоро появятся</div>`;
                } else {
                    for (const ch of chars) {
                        const probeData = PROBES_DB[ch];
                        const hasProbes = probeData && probeData.probes && probeData.probes.length > 0;
                        const probeCount = hasProbes ? probeData.probes.length : 0;
                        const escapedChar = escapeHtml(ch);
                        html += `<li class="character-item" data-char="${escapedChar}">${escapedChar}`;
                        if (hasProbes) {
                            html += `<span class="has-probes" title="Есть пробы"></span>`;
                            html += `<span class="probe-count">(${probeCount})</span>`;
                        }
                        html += `</li>`;
                    }
                }
                html += `</div></div></div>`;
            }
            html += `</div>`;
            container.innerHTML = html;

            document.querySelectorAll('.character-item').forEach(el => {
                el.addEventListener('click', () => {
                    const charName = el.getAttribute('data-char');
                    openProbeModal(charName);
                });
            });
        }

        function openProbeModal(characterName) {
            const modal = document.getElementById('probeModal');
            const modalTitle = document.getElementById('modalCharTitle');
            const probesContainer = document.getElementById('probesListContainer');
            
            modalTitle.textContent = `🎭 Пробы: ${characterName}`;
            
            const characterProbes = PROBES_DB[characterName];
            if (!characterProbes || !characterProbes.probes || characterProbes.probes.length === 0) {
                probesContainer.innerHTML = `<div class="probe-card" style="justify-content:center;">📹 Пробы для этого персонажа скоро появятся.</div>`;
                modal.classList.add('active');
                return;
            }
            
            let html = '';
            for (const probe of characterProbes.probes) {
                const photoPath = probe.photo && probe.photo.trim() !== "" ? probe.photo : "https://via.placeholder.com/200x200?text=Нет+фото";
                const detailsHtml = probe.details ? `<div class="probe-details">${escapeHtml(probe.details)}</div>` : '';
                const extraHtml = probe.extra ? `<div class="probe-desc">${escapeHtml(probe.extra)}</div>` : '';
                html += `
                    <div class="probe-card">
                        <div class="probe-photo">
                            <img src="${escapeHtml(photoPath)}" alt="${escapeHtml(probe.name)}" class="probe-img" data-photo="${escapeHtml(photoPath)}">
                        </div>
                        <div class="probe-info">
                            <div class="probe-name">${escapeHtml(probe.name)}</div>
                            ${detailsHtml}
                            ${extraHtml}
                            <button class="watch-video-btn" data-video="${escapeHtml(probe.videoUrl)}">🎥 Смотреть видео</button>
                        </div>
                    </div>
                `;
            }
            probesContainer.innerHTML = html;
            
            document.querySelectorAll('.probe-img').forEach(img => {
                img.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const photoUrl = img.getAttribute('data-photo');
                    if (photoUrl) openImageModal(photoUrl);
                });
            });
            
            document.querySelectorAll('.watch-video-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const videoUrl = btn.getAttribute('data-video');
                    if (videoUrl && videoUrl.trim()) {
                        openVideoModal(videoUrl);
                    } else {
                        alert('Ссылка на видео отсутствует');
                    }
                });
            });
            
            modal.classList.add('active');
        }

        function openImageModal(photoUrl) {
            document.getElementById('fullscreenImage').src = photoUrl;
            document.getElementById('imageModal').classList.add('active');
        }
        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        // ========== ИСПРАВЛЕННАЯ ФУНКЦИЯ ОТКРЫТИЯ ВИДЕО ==========
        function openVideoModal(videoSource) {
            const modal = document.getElementById('videoModal');
            const container = document.getElementById('videoIframeContainer');
            container.innerHTML = '';
            
            let videoHtml = videoSource.trim();
            
            // Если передан iframe-код — вставляем его целиком
            if (videoHtml.startsWith('<iframe')) {
                // Вставляем iframe как HTML, сохраняя все атрибуты
                container.innerHTML = videoHtml;
                // Убедимся, что iframe занимает 100% контейнера
                const iframe = container.querySelector('iframe');
                if (iframe) {
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = '0';
                }
            } else {
                // Если передана просто ссылка, создаём iframe
                let embedUrl = videoHtml;
                // для Rutube, Youtube и т.д. можно добавить конвертацию
                if (embedUrl.includes('rutube.ru') && embedUrl.includes('/watch/')) {
                    embedUrl = embedUrl.replace('/watch/', '/embed/');
                }
                if (embedUrl.includes('youtube.com/watch') || embedUrl.includes('youtu.be/')) {
                    let videoId = '';
                    if (embedUrl.includes('youtu.be/')) videoId = embedUrl.split('youtu.be/')[1]?.split('?')[0];
                    else videoId = embedUrl.split('v=')[1]?.split('&')[0];
                    if (videoId) embedUrl = `https://www.youtube-nocookie.com/embed/${videoId}`;
                }
                const iframe = document.createElement('iframe');
                iframe.src = embedUrl;
                iframe.setAttribute('frameborder', '0');
                iframe.setAttribute('allow', 'autoplay; fullscreen; accelerometer; gyroscope; picture-in-picture; encrypted-media');
                iframe.setAttribute('allowfullscreen', 'true');
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                container.appendChild(iframe);
            }
            
            modal.classList.add('active');
        }
        // ============================================================
        
        function closeVideoModal() {
            const modal = document.getElementById('videoModal');
            const container = document.getElementById('videoIframeContainer');
            container.innerHTML = '';
            modal.classList.remove('active');
        }

        document.getElementById('closeProbeModal').addEventListener('click', () => document.getElementById('probeModal').classList.remove('active'));
        document.getElementById('probeModal').addEventListener('click', (e) => { if (e.target === document.getElementById('probeModal')) document.getElementById('probeModal').classList.remove('active'); });
        document.getElementById('closeImageBtn').addEventListener('click', closeImageModal);
        document.getElementById('imageModal').addEventListener('click', (e) => { if (e.target === document.getElementById('imageModal')) closeImageModal(); });
        document.getElementById('closeVideoBtn').addEventListener('click', closeVideoModal);
        document.getElementById('videoModal').addEventListener('click', (e) => { if (e.target === document.getElementById('videoModal')) closeVideoModal(); });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('videoModal').classList.contains('active')) closeVideoModal();
                if (document.getElementById('imageModal').classList.contains('active')) closeImageModal();
                if (document.getElementById('probeModal').classList.contains('active')) document.getElementById('probeModal').classList.remove('active');
            }
        });

        // ======================= ТЁМНАЯ / СВЕТЛАЯ ТЕМА =======================
        function initTheme() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.body.classList.remove('light'); document.body.classList.add('dark');
                updateThemeUI('dark');
            } else {
                document.body.classList.remove('dark'); document.body.classList.add('light');
                updateThemeUI('light');
            }
        }
        function updateThemeUI(theme) {
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (theme === 'dark') {
                icon.textContent = '🌙'; text.textContent = 'Тёмная тема';
            } else {
                icon.textContent = '🌞'; text.textContent = 'Светлая тема';
            }
        }
        function toggleTheme() {
            const isDark = document.body.classList.contains('dark');
            if (isDark) {
                document.body.classList.remove('dark'); document.body.classList.add('light');
                localStorage.setItem('theme', 'light'); updateThemeUI('light');
            } else {
                document.body.classList.remove('light'); document.body.classList.add('dark');
                localStorage.setItem('theme', 'dark'); updateThemeUI('dark');
            }
        }
        document.getElementById('themeSwitcher').addEventListener('click', toggleTheme);
        
        renderSeries();
        initTheme();
    </script>
</body>
</html>
