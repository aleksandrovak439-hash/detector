<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Детектор Лжи — пробы персонажей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.25s, color 0.2s, border-color 0.2s;
        }

        /* светлая тема (по умолчанию) */
        :root,
        body.light {
            --bg-body: #f8fafc;
            --bg-header: #ffffff;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.05);
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --chip-bg: #f1f5f9;
            --footer-bg: #f1f5f9;
            --modal-bg: rgba(0,0,0,0.5);
        }

        /* тёмная тема */
        body.dark {
            --bg-body: #0a0c10;
            --bg-header: #11151c;
            --card-bg: #161c27;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-light: #2d3a4e;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.5);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.6);
            --accent: #60a5fa;
            --accent-hover: #93c5fd;
            --chip-bg: #1e2a3a;
            --footer-bg: #0f1219;
            --modal-bg: rgba(0,0,0,0.7);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
        }

        .header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-light);
            padding: 1.25rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
        }

        .title-section h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .title-section p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }

        .theme-toggle {
            background-color: var(--chip-bg);
            border: 1px solid var(--border-light);
            border-radius: 60px;
            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
        }

        .theme-toggle:hover {
            background-color: var(--accent);
            color: white;
        }

        .main-content {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* плашка утверждённые (пустая) */
        .approved-section {
            background-color: var(--card-bg);
            border-radius: 1.5rem;
            border: 1px solid var(--border-light);
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);
        }

        .approved-section h2 {
            font-size: 1.4rem;
            margin-bottom: 0.75rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .approved-empty {
            color: var(--text-muted);
            font-style: italic;
            padding: 0.5rem 0;
        }

        /* сетка серий */
        .series-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.8rem;
        }

        .series-card {
            background: var(--card-bg);
            border-radius: 1.5rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .card-header {
            padding: 1rem 1.5rem 0.5rem;
            border-bottom: 1px solid var(--border-light);
        }

        .series-number {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge-count {
            font-size: 0.75rem;
            background: var(--chip-bg);
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
        }

        .characters-list {
            padding: 1rem 1.5rem 1.5rem;
        }

        .character-items {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            list-style: none;
        }

        .character-item {
            background: var(--chip-bg);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid transparent;
        }

        .character-item:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(1.02);
        }

        .empty-message {
            color: var(--text-muted);
            padding: 0.5rem;
            text-align: center;
            background: var(--chip-bg);
            border-radius: 1rem;
        }

        /* модальное окно (только текст-заглушка) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-bg);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal.active {
            display: flex;
        }

        .modal-container {
            background: var(--card-bg);
            border-radius: 2rem;
            max-width: 500px;
            width: 90%;
            padding: 2rem 1.8rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
            position: relative;
            text-align: center;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--accent);
        }

        .modal-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            color: var(--accent);
        }

        .placeholder-message {
            background: var(--chip-bg);
            padding: 1.5rem;
            border-radius: 1.2rem;
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .footer {
            text-align: center;
            padding: 2rem;
            margin-top: 2rem;
            border-top: 1px solid var(--border-light);
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            .modal-title {
                font-size: 1.3rem;
            }
            .series-grid {
                gap: 1rem;
            }
        }
    </style>
</head>
<body class="light">
    <header class="header">
        <div class="header-container">
            <div class="title-section">
                <h1>🔍 Детектор Лжи</h1>
                <p>Персонажи серий — нажми, чтобы увидеть пробы</p>
            </div>
            <button class="theme-toggle" id="themeSwitcher">
                <span id="themeIcon">🌞</span> <span id="themeText">Светлая тема</span>
            </button>
        </div>
    </header>

    <main class="main-content">
        <!-- Отдельная плашка Утверждённые (пустая, без актёров) -->
        <div class="approved-section" id="approvedSection">
            <h2>✅ Утверждённые (на все серии)</h2>
            <div class="approved-empty">Пока нет утверждённых актёров.</div>
        </div>

        <!-- Список серий будет отрисован здесь -->
        <div id="seriesContainer"></div>
    </main>

    <footer class="footer">
        <p>🎬 При клике на персонажа — список проб (появятся позже)</p>
    </footer>

    <!-- Модальное окно для проб (только заглушка) -->
    <div id="probeModal" class="modal">
        <div class="modal-container">
            <span class="modal-close" id="closeProbeModal">&times;</span>
            <div class="modal-title" id="modalCharTitle">Персонаж</div>
            <div class="placeholder-message">
                📹 <strong>Пробы скоро появятся!</strong><br>
                Список актёров и видеоматериалы будут добавлены позднее.
            </div>
        </div>
    </div>

    <script>
        // ---------- ДАННЫЕ СЕРИЙ (1–16, персонажи по заданию) ----------
        // Вся информация об актёрах и пробах ПОЛНОСТЬЮ УБРАНА.
        // При клике на любого персонажа открывается окно с сообщением "Пробы скоро появятся!"
        const SERIES_DATA = [
            { number: 1, characters: ["Рожнова","Рожнов","Девочка","Изюмов","Кира","Консьержка","Кинолог","Жительница дома","Дворник - азиат"] },
            { number: 2, characters: [] },
            { number: 3, characters: ["Николай Корнилов","Хостес","Охранник ресторана","Массажистка","Мужик в трусах","Мать Стаса","Стас","Официантка","Плисов","Елена","Кладовщик"] },
            { number: 4, characters: ["Котов","Сержант","Старший Сержант","Секретарша","Директор Школы","Охранник Стройки","Бармен"] },
            { number: 5, characters: [] },
            { number: 6, characters: [] },
            { number: 7, characters: [] },
            { number: 8, characters: [] },
            { number: 9, characters: ["Плешаков","Менеджер","Дворник - азиат","Стулов","Консьержка","Женщина","Бабуля","Горохов","Курьер (каскадер)","Муж Петровой"] },
            { number: 10, characters: [] },
            { number: 11, characters: [] },
            { number: 12, characters: ["Рожкова","Сосед","Журналистка","Оператор","Оксана","Владелец Тира","Прохожий"] },
            { number: 13, characters: [] },
            { number: 14, characters: [] },
            { number: 15, characters: [] },
            { number: 16, characters: [] }
        ];

        // Рендер списка серий
        function renderSeries() {
            const container = document.getElementById('seriesContainer');
            let html = `<div class="series-grid">`;
            for (const series of SERIES_DATA) {
                const chars = series.characters;
                html += `
                    <div class="series-card">
                        <div class="card-header">
                            <div class="series-number">
                                🎞️ Серия ${series.number}
                                <span class="badge-count">${chars.length} перс.</span>
                            </div>
                        </div>
                        <div class="characters-list">
                            <div class="character-items">
                `;
                if (chars.length === 0) {
                    html += `<div class="empty-message">✨ Персонажи скоро появятся</div>`;
                } else {
                    for (const ch of chars) {
                        html += `<li class="character-item" data-char="${escapeHtml(ch)}">${escapeHtml(ch)}</li>`;
                    }
                }
                html += `</div></div></div>`;
            }
            html += `</div>`;
            container.innerHTML = html;

            // обработчики клика по персонажам
            document.querySelectorAll('.character-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const charName = el.getAttribute('data-char');
                    openProbeModal(charName);
                });
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Модальное окно — показываем заглушку
        const probeModal = document.getElementById('probeModal');
        const modalCharTitle = document.getElementById('modalCharTitle');

        function openProbeModal(characterName) {
            modalCharTitle.textContent = `🎭 Пробы: ${characterName}`;
            probeModal.classList.add('active');
        }

        function closeProbeModal() {
            probeModal.classList.remove('active');
        }

        // Закрытие модалки
        document.getElementById('closeProbeModal').addEventListener('click', closeProbeModal);
        probeModal.addEventListener('click', (e) => {
            if (e.target === probeModal) closeProbeModal();
        });

        // ----- ТЁМНАЯ / СВЕТЛАЯ ТЕМА -----
        function initTheme() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.body.classList.remove('light');
                document.body.classList.add('dark');
                updateThemeUI('dark');
            } else {
                document.body.classList.remove('dark');
                document.body.classList.add('light');
                updateThemeUI('light');
            }
        }
        function updateThemeUI(theme) {
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (theme === 'dark') {
                icon.textContent = '🌙';
                text.textContent = 'Тёмная тема';
            } else {
                icon.textContent = '🌞';
                text.textContent = 'Светлая тема';
            }
        }
        function toggleTheme() {
            const isDark = document.body.classList.contains('dark');
            if (isDark) {
                document.body.classList.remove('dark');
                document.body.classList.add('light');
                localStorage.setItem('theme', 'light');
                updateThemeUI('light');
            } else {
                document.body.classList.remove('light');
                document.body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                updateThemeUI('dark');
            }
        }
        document.getElementById('themeSwitcher').addEventListener('click', toggleTheme);

        // Запуск
        renderSeries();
        initTheme();
    </script>
</body>
</html>
