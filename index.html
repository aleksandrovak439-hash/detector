<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Детектор Лжи — серии и персонажи</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.25s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        /* ----- СВЕТЛАЯ ТЕМА (по умолчанию) ----- */
        :root,
        body.light {
            --bg-body: #f8fafc;
            --bg-header: #ffffff;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --chip-bg: #f1f5f9;
            --footer-bg: #f1f5f9;
        }

        /* ----- ТЁМНАЯ ТЕМА ----- */
        body.dark {
            --bg-body: #0a0c10;
            --bg-header: #11151c;
            --card-bg: #161c27;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-light: #2d3a4e;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            --accent: #60a5fa;
            --accent-hover: #93c5fd;
            --chip-bg: #1e2a3a;
            --footer-bg: #0f1219;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            line-height: 1.5;
            font-weight: 400;
        }

        /* шапка */
        .header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-light);
            padding: 1.25rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(0px);
            box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
        }

        .title-section h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .title-section p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }

        /* переключатель темы */
        .theme-toggle {
            background-color: var(--chip-bg);
            border: 1px solid var(--border-light);
            border-radius: 60px;
            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* основной контент */
        .main-content {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .series-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.8rem;
        }

        /* карточка серии */
        .series-card {
            background-color: var(--card-bg);
            border-radius: 1.5rem;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .series-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .card-header {
            padding: 1.2rem 1.5rem 0.6rem 1.5rem;
            border-bottom: 1px solid var(--border-light);
            background: rgba(0,0,0,0.01);
        }

        .series-number {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .series-number span {
            background: var(--accent);
            color: white;
            font-size: 1rem;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
        }

        .badge-count {
            font-size: 0.75rem;
            font-weight: normal;
            background-color: var(--chip-bg);
            color: var(--text-secondary);
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            margin-left: 0.6rem;
        }

        .characters-list {
            padding: 1.2rem 1.5rem 1.5rem 1.5rem;
        }

        .characters-title {
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent);
            margin-bottom: 0.8rem;
        }

        .character-items {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            list-style: none;
        }

        .character-item {
            background: var(--chip-bg);
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.1s;
            border: 1px solid transparent;
        }

        .character-item:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--card-bg);
        }

        .empty-message {
            color: var(--text-muted);
            font-style: italic;
            padding: 0.5rem 0;
            font-size: 0.9rem;
            background: var(--chip-bg);
            border-radius: 1rem;
            text-align: center;
            margin-top: 0.3rem;
        }

        /* футер */
        .footer {
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 3rem;
            border-top: 1px solid var(--border-light);
            background-color: var(--footer-bg);
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* адаптивность: планшеты и телефоны */
        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
            }
            .title-section h1 {
                font-size: 1.5rem;
            }
            .series-grid {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }
            .main-content {
                padding: 0 1rem;
                margin: 1.5rem auto;
            }
            .card-header {
                padding: 1rem 1.2rem 0.4rem 1.2rem;
            }
            .characters-list {
                padding: 1rem 1.2rem 1.2rem 1.2rem;
            }
            .character-item {
                font-size: 0.8rem;
                padding: 0.2rem 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .series-number {
                font-size: 1.3rem;
            }
            .badge-count {
                font-size: 0.7rem;
            }
        }

        /* анимация появления карточек */
        .series-card {
            animation: fadeInUp 0.3s ease backwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="light">
    <header class="header">
        <div class="header-container">
            <div class="title-section">
                <h1>🔍 Детектор Лжи</h1>
                <p>Все серии и персонажи — 1–16 эпизоды</p>
            </div>
            <button class="theme-toggle" id="themeSwitcher" aria-label="Переключить тему">
                <span id="themeIcon">🌞</span> 
                <span id="themeText">Светлая тема</span>
            </button>
        </div>
    </header>

    <main class="main-content">
        <div class="series-grid" id="seriesContainer"></div>
    </main>

    <footer class="footer">
        <p>🎭 Детектор Лжи | Список персонажей по сериям (постоянное обновление)</p>
    </footer>

    <script>
        // ----- ДАННЫЕ О СЕРИЯХ И ПЕРСОНАЖАХ (проект "Детектор Лжи") -----
        const SERIES_DATA = [
            { number: 1, characters: ["Рожнова", "Рожнов", "Девочка", "Изюмов", "Кира", "Консьержка", "Кинолог", "Жительница дома", "Дворник - азиат"] },
            { number: 2, characters: [] },
            { number: 3, characters: ["Николай Корнилов", "Хостес", "Охранник ресторана", "Массажистка", "Мужик в трусах", "Мать Стаса", "Стас", "Официантка", "Плисов", "Елена", "Кладовщик"] },
            { number: 4, characters: ["Котов", "Сержант", "Старший Сержант", "Секретарша", "Директор Школы", "Охранник Стройки", "Бармен"] },
            { number: 5, characters: [] },
            { number: 6, characters: [] },
            { number: 7, characters: [] },
            { number: 8, characters: [] },
            { number: 9, characters: ["Плешаков", "Менеджер", "Дворник - азиат", "Стулов", "Консьержка", "Женщина", "Бабуля", "Горохов", "Курьер (каскадер)", "Муж Петровой"] },
            { number: 10, characters: [] },
            { number: 11, characters: [] },
            { number: 12, characters: ["Рожкова", "Сосед", "Журналистка", "Оператор", "Оксана", "Владелец Тира", "Прохожий"] },
            { number: 13, characters: [] },
            { number: 14, characters: [] },
            { number: 15, characters: [] },
            { number: 16, characters: [] }
        ];

        // Функция для рендера всех карточек
        function renderSeries() {
            const container = document.getElementById('seriesContainer');
            if (!container) return;

            container.innerHTML = '';

            SERIES_DATA.forEach(series => {
                const card = document.createElement('article');
                card.className = 'series-card';
                
                const charactersCount = series.characters.length;
                const hasCharacters = charactersCount > 0;
                
                const cardHeader = document.createElement('div');
                cardHeader.className = 'card-header';
                
                const seriesNumberDiv = document.createElement('div');
                seriesNumberDiv.className = 'series-number';
                seriesNumberDiv.innerHTML = `
                    🎞️ Серия ${series.number}
                    <span class="badge-count">${charactersCount} перс.</span>
                `;
                cardHeader.appendChild(seriesNumberDiv);
                
                const charactersBlock = document.createElement('div');
                charactersBlock.className = 'characters-list';
                
                const charactersTitle = document.createElement('div');
                charactersTitle.className = 'characters-title';
                charactersTitle.textContent = '👥 В этой серии';
                charactersBlock.appendChild(charactersTitle);
                
                if (hasCharacters) {
                    const list = document.createElement('ul');
                    list.className = 'character-items';
                    
                    series.characters.forEach(character => {
                        const li = document.createElement('li');
                        li.className = 'character-item';
                        li.textContent = character;
                        list.appendChild(li);
                    });
                    charactersBlock.appendChild(list);
                } else {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'empty-message';
                    emptyDiv.innerHTML = '📌 Персонажи уточняются...';
                    charactersBlock.appendChild(emptyDiv);
                }
                
                card.appendChild(cardHeader);
                card.appendChild(charactersBlock);
                container.appendChild(card);
            });
        }
        
        // ----- ТЕМНАЯ / СВЕТЛАЯ ТЕМА (с сохранением в localStorage) -----
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark') {
                document.body.classList.remove('light');
                document.body.classList.add('dark');
                updateThemeUI('dark');
            } else if (savedTheme === 'light') {
                document.body.classList.remove('dark');
                document.body.classList.add('light');
                updateThemeUI('light');
            } else {
                if (prefersDark) {
                    document.body.classList.remove('light');
                    document.body.classList.add('dark');
                    updateThemeUI('dark');
                } else {
                    document.body.classList.remove('dark');
                    document.body.classList.add('light');
                    updateThemeUI('light');
                }
            }
        }
        
        function updateThemeUI(theme) {
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            if (!themeIcon || !themeText) return;
            
            if (theme === 'dark') {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Тёмная тема';
            } else {
                themeIcon.textContent = '🌞';
                themeText.textContent = 'Светлая тема';
            }
        }
        
        function toggleTheme() {
            const isDark = document.body.classList.contains('dark');
            if (isDark) {
                document.body.classList.remove('dark');
                document.body.classList.add('light');
                localStorage.setItem('theme', 'light');
                updateThemeUI('light');
            } else {
                document.body.classList.remove('light');
                document.body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                updateThemeUI('dark');
            }
        }
        
        function bindThemeSwitcher() {
            const switcher = document.getElementById('themeSwitcher');
            if (switcher) {
                switcher.addEventListener('click', toggleTheme);
            }
        }
        
        function applyCardDelay() {
            const cards = document.querySelectorAll('.series-card');
            cards.forEach((card, idx) => {
                card.style.animationDelay = `${idx * 0.02}s`;
            });
        }
        
        function init() {
            renderSeries();
            initTheme();
            bindThemeSwitcher();
            setTimeout(() => applyCardDelay(), 50);
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
        
        window.addEventListener('resize', () => {
            if (window.innerWidth < 768) {
                document.body.style.overflowX = 'hidden';
            }
        });
    </script>
</body>
</html>
